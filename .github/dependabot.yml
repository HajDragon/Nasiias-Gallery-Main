version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    cooldown:
      default-days: 5
    groups:
      laravel-core:
        patterns:
          - "laravel/*"
      filament:
        patterns:
          - "filament/*"
      spatie:
        patterns:
          - "spatie/*"
      testing:
        patterns:
          - "pestphp/*"
          - "mockery/*"
          - "phpunit/*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
    cooldown:
      default-days: 5
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      framer-motion:
        patterns:
          - "framer-motion"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "laravel-vite-plugin"
          - "vite-plus"
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "chai"
          - "@vitest/*"
